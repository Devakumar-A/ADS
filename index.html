    <meta name="geo.region" content="IN-PY;IN-TN" />

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "AdvertisingAgency",
      "name": "AG ADS",
      "alternateName": "Advanced Growth",
      "description": "AG ADS is a premier marketing and advertising agency in Puducherry and Chennai connecting digital marketing and outdoor media.",
      "url": "https://agads.in",
      "logo": "https://agads.in/assets/brand/AG_logo.png",
      "telephone": "+916369846324",
      "address": [
        {
          "@type": "PostalAddress",
          "addressLocality": "Puducherry",
          "addressRegion": "PY",
          "addressCountry": "IN"
        },
        {
          "@type": "PostalAddress",
          "addressLocality": "Chennai",
          "addressRegion": "TN",
          "addressCountry": "IN"
        }
      ],
      "areaServed": ["Puducherry", "Chennai", "Tamil Nadu"],
      "sameAs": [
        "https://instagram.com/ag.ads.pondy"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "AG ADS Marketing Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Digital Marketing",
              "description": "Meta Ads, Google Ads, Social Media Management, Graphic Design, Video Production, Video Editing, Branding, Website Development."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Outdoor Marketing",
              "description": "Radio Advertising, TV Advertising, Newspaper Advertising, Sun-Pack Advertising, LED Van Advertising, Mall Advertising."
            }
          }
        ]
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Typography: Manrope (Display/Headings: 600, 700, 800) + Inter (Interface/Body: 400, 500, 600, 700) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
